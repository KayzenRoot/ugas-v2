name: Source Pack Integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  canonical-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical source pack
        shell: bash
        run: |
          set -euo pipefail
          required=(
            "README.md"
            "AGENTS.md"
            "docs/checkpoint/CURRENT.md"
            "docs/SOURCE-HIERARCHY.md"
            "docs/PROJECT-OVERVIEW.md"
            "docs/REQUIREMENTS.md"
            "docs/SCOPE.md"
            "docs/ARCHITECTURE.md"
            "docs/SECURITY.md"
            "docs/TEST-BENCHMARK-PLAN.md"
            "docs/DEPLOYMENT.md"
            "docs/BACKLOG.md"
            "docs/DEFINITION-OF-DONE.md"
            "docs/decisions/DECISIONS-LEDGER.md"
            "docs/contracts/DATA-MODEL.md"
            "docs/contracts/API-CONTRACTS.md"
            "docs/contracts/INTEGRATION-CONTRACTS.md"
            "docs/UI-UX.md"
            "docs/MIGRATION-RECOVERY.md"
            "docs/modules/INDEX.md"
            "docs/FUNCTIONAL-CATALOG-ROUNDS-01-23.md"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing canonical file: $f"; exit 1; }
          done

          module_count="$(find docs/modules -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9]{2}-.*\.md' | wc -l | tr -d ' ')"
          test "$module_count" -eq 23 || { echo "Expected 23 module specs, got $module_count"; exit 1; }

          adr_count="$(find docs/adr -maxdepth 1 -type f -name 'ADR-*.md' | wc -l | tr -d ' ')"
          test "$adr_count" -ge 12 || { echo "Expected at least 12 ADRs, got $adr_count"; exit 1; }

          grep -q "SOURCE_PACK_BOOTSTRAP_APPROVED" docs/checkpoint/CURRENT.md
          grep -q "chat memory" docs/SOURCE-HIERARCHY.md
          echo "Canonical source pack integrity: OK"

invariants:
  - canonical intent is provider independent
  - every mutation has lineage and evidence expectations
  - hard quality security rights gates cannot be traded for speed
  - unchanged proofs carry forward by fingerprint
  - provider adapters are replaceable
  - new technologies require M29 qualification
  - no module may silently assume more hardware than M02 reports
  - Codex may not redesign ownership during implementation

codex_ready_definition:
  - module tree materialized
  - exact TODO contracts present
  - dependency imports bounded
  - focused tests present
  - Context Pack names READ MODIFY CREATE DO_NOT_TOUCH
  - Test Impact Graph present
  - acceptance and evidence conditions explicit
version: 1
status: PREPROGRAMMING_SPEC_COMPLETE
wave: 1
modules: M01-M09
purpose: >
  Give Codex exact domain objects, ports, orchestration order, invariants, errors and focused proof targets.
  Codex implements prepared contracts; it does not redesign them.
global_rules:
  - canonical intent is provider independent
  - ids are immutable and versioned objects use fingerprints
  - provider failures never mutate accepted canonical state
  - every mutation emits lineage/evidence
  - test only affected dependency cone
  - adapters cannot weaken quality, rights, security or identity locks
modules:
  M01:
    package: m01_product_production_os
    contracts: [ProjectId, ProductionId, GraphNodeId, GraphEdge, NodeState, ProductionGraph, ExecutionPlan, ArtifactRef, AcceptanceDecision]
    services: [ProductionGraphService, StateTransitionService, InvalidationService, ExecutionPlanningService]
    ports: [MetadataRepository, EventBus, EvidenceSink, Clock]
    flow: [validate_command, load_graph, enforce_state_transition, compute_dependency_delta, persist_transaction, emit_events, write_evidence]
    errors: [InvalidTransition, DependencyCycle, StaleGraphVersion, InvariantViolation]
    tests: [state_machine_contract, deterministic_invalidation, graph_cycle_rejection, accepted_artifact_lineage]
  M02:
    package: m02_hardware_intelligence
    contracts: [HardwareProfile, GpuProfile, CpuProfile, MemoryProfile, ResourceEnvelope, CapabilityProbe, ResourceLease]
    services: [HardwareProbeService, ResourceEnvelopeService, LeasePlanner]
    ports: [SystemProbe, GpuTelemetry, ResourceLeaseStore]
    flow: [probe, normalize, fingerprint, derive_envelope, publish_capabilities]
    errors: [ProbeUnavailable, UnsupportedDevice, ResourcePressure, LeaseConflict]
    tests: [stable_hardware_fingerprint, vram_budget_enforced, degraded_probe_is_explicit]
  M03:
